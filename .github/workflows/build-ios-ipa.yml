name: Build SmartGradeScanner unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DEVELOPER_NAME: "Yousef Yousef"
  TEAM_NAME: "Yousef Yousef"

  PROJECT: "SmartGradeScanner.xcodeproj"
  TARGET: "SmartGradeScanner"
  SCHEME: "SmartGradeScanner"

  APP_NAME: "SmartGradeScanner"
  BUNDLE_IDENTIFIER: "com.smartgrade.scanner"

jobs:
  build-ios-unsigned:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Select Xcode 26.6
      # ==========================================

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # ==========================================
      # 3. Show Xcode and SDK versions
      # ==========================================

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail

          echo "Xcode version:"
          xcodebuild -version

          echo ""
          echo "iPhoneOS SDK version:"
          xcrun --sdk iphoneos --show-sdk-version

      # ==========================================
      # 4. Validate project
      # ==========================================

      - name: Validate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Xcode project..."

          if [[ ! -d "${PROJECT}" ]]; then
            echo "ERROR: Project not found: ${PROJECT}"
            exit 1
          fi

          if [[ ! -f "${PROJECT}/project.pbxproj" ]]; then
            echo "ERROR: project.pbxproj not found."
            exit 1
          fi

          echo "Project found successfully."

          echo ""
          echo "Available targets and schemes:"

          xcodebuild \
            -list \
            -project "${PROJECT}"

      # ==========================================
      # 5. Verify application target exists
      # ==========================================

      - name: Verify SmartGradeScanner target
        shell: bash
        run: |
          set -euo pipefail

          TARGET_LIST="$(
            xcodebuild \
              -project "${PROJECT}" \
              -list \
              2>/dev/null
          )"

          echo "${TARGET_LIST}"

          if ! echo "${TARGET_LIST}" | grep -q "${TARGET}"; then
            echo ""
            echo "ERROR: Target '${TARGET}' was not found."
            exit 1
          fi

          echo ""
          echo "Target '${TARGET}' found successfully."

      # ==========================================
      # 6. Clean old output
      # ==========================================

      - name: Clean previous build files
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old build files..."

          rm -rf build
          rm -rf artifacts
          rm -rf Payload

          rm -f SmartGradeScanner-unsigned.ipa
          rm -f SmartGradeScanner-unsigned.app.zip
          rm -f build.log
          rm -f test.log

          mkdir -p artifacts

          echo "Old build files removed."

      # ==========================================
      # 7. List and select an available iOS Simulator
      # ==========================================

      - name: List available iOS Simulators
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available

      - name: Select first available iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          SIMULATOR_UDID="$(
            xcrun simctl list devices available \
              | sed -n 's/.*(\([0-9A-F-]\{36\}\)) (Shutdown\|Booted).*/\1/p' \
              | head -n 1
          )"

          if [[ -z "${SIMULATOR_UDID}" ]]; then
            echo "ERROR: No available iOS Simulator was found."
            exit 1
          fi

          echo "Selected iOS Simulator UDID: ${SIMULATOR_UDID}"
          echo "destination=platform=iOS Simulator,id=${SIMULATOR_UDID}" >> "${GITHUB_OUTPUT}"

      # ==========================================
      # 8. Run unit tests without code signing
      # ==========================================

      - name: Run unit tests without code signing
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild test \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SDKROOT=iphonesimulator \
            | tee test.log

      # ==========================================
      # 9. Build ONLY SmartGradeScanner app
      # ==========================================

      - name: Build unsigned iPhone application
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          echo "====================================="
          echo "Building application target:"
          echo "${TARGET}"
          echo "====================================="

          xcodebuild \
            -project "${PROJECT}" \
            -target "${TARGET}" \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="${PWD}/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_IDENTIFIER}" \
            build \
            | tee build.log

      # ==========================================
      # 8. Find generated .app
      # ==========================================

      - name: Locate generated application
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for ${APP_NAME}.app..."

          APP_PATH="$(
            find build \
              -type d \
              -name "${APP_NAME}.app" \
              -path '*Release-iphoneos*' \
              -print \
              -quit
          )"

          if [[ -z "${APP_PATH}" ]]; then
            echo ""
            echo "ERROR: ${APP_NAME}.app was not found."
            echo ""
            echo "Build directory contents:"
            find build -maxdepth 8 -print || true
            exit 1
          fi

          echo ""
          echo "Application found:"
          echo "${APP_PATH}"

          echo "APP_PATH=${APP_PATH}" >> "${GITHUB_ENV}"

      # ==========================================
      # 9. Verify unsigned application
      # ==========================================

      - name: Verify unsigned application
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "${APP_PATH}" ]]; then
            echo "ERROR: Application directory does not exist."
            exit 1
          fi

          echo "Checking application..."

          if [[ -d "${APP_PATH}/_CodeSignature" ]]; then
            echo "Removing unexpected code signature..."
            rm -rf "${APP_PATH}/_CodeSignature"
          fi

          if [[ -f "${APP_PATH}/embedded.mobileprovision" ]]; then
            echo "Removing unexpected provisioning profile..."
            rm -f "${APP_PATH}/embedded.mobileprovision"
          fi

          echo ""
          echo "Unsigned application verified successfully."

      # ==========================================
      # 10. Create Payload directory
      # ==========================================

      - name: Create IPA Payload
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating Payload..."

          rm -rf artifacts/Payload

          mkdir -p artifacts/Payload

          cp -R \
            "${APP_PATH}" \
            "artifacts/Payload/${APP_NAME}.app"

          if [[ ! -d "artifacts/Payload/${APP_NAME}.app" ]]; then
            echo "ERROR: Failed to copy application into Payload."
            exit 1
          fi

          echo ""
          echo "Payload created successfully."

      # ==========================================
      # 11. Create unsigned IPA
      # ==========================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating unsigned IPA..."

          cd artifacts

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "../SmartGradeScanner-unsigned.ipa"

          cd ..

          if [[ ! -f "SmartGradeScanner-unsigned.ipa" ]]; then
            echo "ERROR: IPA creation failed."
            exit 1
          fi

          echo ""
          echo "IPA created successfully:"
          ls -lh SmartGradeScanner-unsigned.ipa

      # ==========================================
      # 12. Create app ZIP
      # ==========================================

      - name: Create application ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating APP ZIP..."

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "artifacts/Payload/${APP_NAME}.app" \
            "SmartGradeScanner-unsigned.app.zip"

          if [[ ! -f "SmartGradeScanner-unsigned.app.zip" ]]; then
            echo "ERROR: APP ZIP creation failed."
            exit 1
          fi

          echo ""
          echo "APP ZIP created successfully:"
          ls -lh SmartGradeScanner-unsigned.app.zip

      # ==========================================
      # 13. Generate metadata
      # ==========================================

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail

          XCODE_VERSION="$(xcodebuild -version | head -1)"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          cat > artifacts/BUILD-METADATA.txt <<EOF
          Application: SmartGradeScanner
          Bundle Identifier: ${BUNDLE_IDENTIFIER}

          Developer: ${DEVELOPER_NAME}
          Team: ${TEAM_NAME}

          Project: ${PROJECT}
          Target: ${TARGET}
          Scheme: ${SCHEME}

          Configuration: Release
          SDK: iphoneos
          iOS SDK Version: ${IOS_SDK_VERSION}
          Xcode: ${XCODE_VERSION}

          Code Signing: Disabled
          Code Signing Identity: None
          Development Team ID: None
          Provisioning Profile: None

          Output IPA:
          SmartGradeScanner-unsigned.ipa

          Output APP ZIP:
          SmartGradeScanner-unsigned.app.zip

          Important:
          This IPA is unsigned.
          It must be signed before normal installation
          on an iPhone or iPad.
          EOF

          echo ""
          echo "Build metadata:"
          cat artifacts/BUILD-METADATA.txt

      # ==========================================
      # 14. Verify IPA structure
      # ==========================================

      - name: Verify IPA structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking IPA contents..."

          unzip -l SmartGradeScanner-unsigned.ipa | head -50

          if ! unzip -l SmartGradeScanner-unsigned.ipa \
            | grep -q "Payload/${APP_NAME}.app/"; then

            echo ""
            echo "ERROR: IPA does not contain expected Payload application."
            exit 1
          fi

          echo ""
          echo "IPA structure verified successfully."

      # ==========================================
      # 15. Show generated files
      # ==========================================

      - name: Show generated files
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "====================================="
          echo "BUILD FINISHED SUCCESSFULLY"
          echo "====================================="

          echo ""
          echo "IPA:"
          ls -lh SmartGradeScanner-unsigned.ipa

          echo ""
          echo "APP ZIP:"
          ls -lh SmartGradeScanner-unsigned.app.zip

          echo ""
          echo "Payload:"
          find artifacts/Payload -maxdepth 2 -print

      # ==========================================
      # 16. Upload IPA artifact
      # ==========================================

      - name: Upload SmartGradeScanner IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartGradeScanner-unsigned-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            SmartGradeScanner-unsigned.ipa
            SmartGradeScanner-unsigned.app.zip
            artifacts/BUILD-METADATA.txt
            artifacts/Payload/SmartGradeScanner.app
            test.log
            build.log

      # ==========================================
      # 17. Upload build log if build fails
      # ==========================================

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SmartGradeScanner-build-error-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test.log
            build.log
