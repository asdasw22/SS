name: Build SmartGradeScanner IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Build IPA
        shell: bash
        run: |
          chmod +x tools/build_ipa.sh
          ./tools/build_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartGradeScanner-IPA-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            IPA_OUTPUT/SmartGradeScanner-unsigned.ipa
            IPA_OUTPUT/SmartGradeScanner-unsigned.app.zip
            IPA_OUTPUT/BUILD-METADATA.txt
            IPA_OUTPUT/build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SmartGradeScanner-build-error-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: IPA_OUTPUT/build.log
